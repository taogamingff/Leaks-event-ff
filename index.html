<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang bảo trì</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.08), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,.06), transparent 30%),
        #050505;
    color: #fff;
    overflow: hidden;
}

/* Hiệu ứng nền */
.bg-circle {
    position: fixed;
    width: 300px;
    height: 300px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 50%;
    animation: rotate 15s linear infinite;
}

.circle1 {
    width: 500px;
    height: 500px;
}

.circle2 {
    width: 750px;
    height: 750px;
    animation-direction: reverse;
    animation-duration: 25s;
}

@keyframes rotate {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

/* Khung chính */
.container {
    width: min(92%, 520px);
    padding: 40px 28px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 28px;
    background: rgba(20,20,20,.82);
    backdrop-filter: blur(18px);
    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.05);
    position: relative;
    z-index: 2;
}

/* Icon */
.icon {
    width: 105px;
    height: 105px;
    margin: 0 auto 25px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    border: 2px solid rgba(255,255,255,.15);
    box-shadow: 0 0 40px rgba(255,255,255,.08);
    animation: pulse 2s infinite;
}

.icon span {
    font-size: 50px;
    animation: spin 4s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@keyframes pulse {
    0%,100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(255,255,255,.05);
    }
    50% {
        transform: scale(1.05);
        box-shadow: 0 0 45px rgba(255,255,255,.12);
    }
}

/* Nội dung */
.badge {
    display: inline-block;
    padding: 7px 14px;
    margin-bottom: 15px;
    border-radius: 30px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

h1 {
    font-size: 32px;
    margin-bottom: 14px;
}

.description {
    color: #aaa;
    line-height: 1.7;
    font-size: 15px;
    margin-bottom: 25px;
}

/* Thanh trạng thái */
.status {
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    margin-bottom: 22px;
}

.status-title {
    font-size: 12px;
    color: #888;
    margin-bottom: 7px;
}

.status-text {
    font-size: 15px;
    font-weight: bold;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    margin-right: 7px;
    animation: blink 1.2s infinite;
}

@keyframes blink {
    50% {
        opacity: .25;
    }
}

/* Nút */
button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: #fff;
    color: #000;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .25s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255,255,255,.12);
}

button:active {
    transform: scale(.98);
}

/* Footer */
.footer {
    margin-top: 22px;
    color: #666;
    font-size: 12px;
}

.footer b {
    color: #aaa;
}

/* Mobile */
@media (max-width: 480px) {
    .container {
        padding: 32px 20px;
    }

    h1 {
        font-size: 27px;
    }

    .icon {
        width: 90px;
        height: 90px;
    }

    .icon span {
        font-size: 42px;
    }
}
</style>
</head>

<body>

<div class="bg-circle circle1"></div>
<div class="bg-circle circle2"></div>

<div class="container">

    <div class="icon">
        <span>⚙️</span>
    </div>

    <div class="badge">
        ● SYSTEM MAINTENANCE
    </div>

    <h1>Website đang bảo trì</h1>

    <p class="description">
        Hệ thống hiện đang được bảo trì để nâng cấp và cải thiện
        trải nghiệm sử dụng. Vui lòng quay lại sau ít phút.
    </p>

    <div class="status">
        <div class="status-title">TRẠNG THÁI HỆ THỐNG</div>

        <div class="status-text">
            <span class="dot"></span>
            Đang tiến hành bảo trì
        </div>
    </div>

    <button onclick="location.reload()">
        ↻ KIỂM TRA LẠI
    </button>

    <div class="footer">
        © 2026 <b>FFVN.TGM</b> — Maintenance System
    </div>

</div>

<script>
/* Tự động kiểm tra lại sau 30 giây */
setTimeout(() => {
    location.reload();
}, 30000);
</script>

</body>
</html>
